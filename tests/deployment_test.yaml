suite: test deployment
templates:
  - templates/deployment.yaml
tests:
  - it: should render exactly one document
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a Deployment
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1

  - it: should have correct default name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-test-chart

  - it: should set default replicas to 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should override replicas from values
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should have correct selector matchLabels
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: test-chart
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should have correct pod template labels
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: test-chart
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should have container named test-chart
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: test-chart

  - it: should use default image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "nginx:1.25"

  - it: should override image repository and tag
    set:
      image:
        repository: custom-repo/app
        tag: "2.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "custom-repo/app:2.0"

  - it: should set default imagePullPolicy to IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: should override imagePullPolicy
    set:
      image:
        pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should expose http port 80
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 80
      - equal:
          path: spec.template.spec.containers[0].ports[0].protocol
          value: TCP

  - it: should set default resources
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 64Mi

  - it: should override resources from values
    set:
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 200m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: should reference configmap in envFrom
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: RELEASE-NAME-test-chart

  - it: should reference secret in envFrom
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: RELEASE-NAME-test-chart

  - it: should use nameOverride in envFrom references
    set:
      nameOverride: custom-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: RELEASE-NAME-custom-name
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: RELEASE-NAME-custom-name

  - it: should use fullnameOverride in envFrom references
    set:
      fullnameOverride: my-app
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: my-app
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: my-app
