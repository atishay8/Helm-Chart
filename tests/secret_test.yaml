suite: test secret
templates:
  - templates/secret.yaml
tests:
  - it: should render exactly one document
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a Secret
    asserts:
      - isKind:
          of: Secret
      - isAPIVersion:
          of: v1

  - it: should have correct default name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-test-chart

  - it: should have type Opaque
    asserts:
      - equal:
          path: type
          value: Opaque

  - it: should base64 encode default dbPassword
    asserts:
      - equal:
          path: data.DB_PASSWORD
          value: "Y2hhbmdlbWU="

  - it: should base64 encode custom dbPassword
    set:
      secret:
        dbPassword: "mysecretpass"
    asserts:
      - equal:
          path: data.DB_PASSWORD
          value: "bXlzZWNyZXRwYXNz"

  - it: should handle special characters in password
    set:
      secret:
        dbPassword: "p@ss!#$%"
    asserts:
      - equal:
          path: data.DB_PASSWORD
          value: "cEBzcyEjJCU="
