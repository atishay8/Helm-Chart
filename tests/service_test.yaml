suite: test service
templates:
  - templates/service.yaml
tests:
  - it: should render exactly one document
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a Service
    asserts:
      - isKind:
          of: Service
      - isAPIVersion:
          of: v1

  - it: should have correct default name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-test-chart

  - it: should have default type ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should override service type
    set:
      service:
        type: NodePort
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: should set service type to LoadBalancer
    set:
      service:
        type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: should have default port 80
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80

  - it: should override service port
    set:
      service:
        port: 8080
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: should have correct port configuration
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[0].protocol
          value: TCP
      - equal:
          path: spec.ports[0].name
          value: http

  - it: should have correct selector labels
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: test-chart
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should use nameOverride in selector
    set:
      nameOverride: custom-name
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: custom-name
